<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upande Propagation</title>
    <!-- Poppins is self-hosted via @font-face in src/index.css (bundled). -->
    <!-- The loading cover. Mirrors www/propagation_app.html, which is what actually
         serves this app; kept in step so the dev server and the real page behave alike. -->
    <style>
      html, body { height: 100%; margin: 0; padding: 0; background: #fbfaf6; }
      body { overflow: hidden; }
      #propagation-root { height: 100vh; width: 100%; overflow: auto; }
      .pr-splash {
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; align-items: center; justify-content: center;
        background: #ffffff; transition: opacity 280ms ease;
      }
      .pr-splash img { width: 106px; height: auto; display: block; }
      .pr-splash.pr-leaving { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="propagation-root"></div>
    <div class="pr-splash" id="pr-splash">
      <img id="pr-splash-mark" src="/assets/upande_propagation/images/propagation_logo_loader.svg" alt="Upande Propagation" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

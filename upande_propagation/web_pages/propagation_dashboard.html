  var CHART_BRAND='#2563eb';
  function svgChart(wrapId,labels,series,height){
    var el=document.getElementById(wrapId); if(!el) return;
    var pick=function(c){return (!c||c==='#000')?CHART_BRAND:c;};
    var sn=series.length;
    var W=Math.max(el.clientWidth||700,320);
    var H=height||((sn>1?(el.clientHeight-22):el.clientHeight)||280);
    var maxLen=0; labels.forEach(function(l){var L=String(l==null?'':l).length; if(L>maxLen)maxLen=L;});
    var lblFont=maxLen>16?8:(maxLen>9?9:10);
    var padB=Math.min(110, 30+Math.round(maxLen*lblFont*0.55));
    var padL=56,padR=14,padT=14, n=Math.max(labels.length,1);
    var maxV=1; series.forEach(function(s){s.data.forEach(function(v){v=Number(v)||0;if(v>maxV)maxV=v;});});
    var plotW=W-padL-padR, plotH=H-padT-padB, group=plotW/n, bw=Math.max(2,Math.min((group*0.72)/sn,44)), baseY=padT+plotH;
    var nf=function(v){return Number(v).toLocaleString(undefined,{maximumFractionDigits:0});};
    var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family="Inter,system-ui,sans-serif">';
    for(var g=0;g<=4;g++){var gy=padT+plotH*(1-g/4);
      s+='<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="#ececec"/>';
      s+='<text x="'+(padL-6)+'" y="'+(gy+3).toFixed(1)+'" text-anchor="end" font-size="10" fill="#9a9a9a">'+nf(maxV*g/4)+'</text>';}
    var step=Math.max(1,Math.ceil(n/Math.max(1,Math.floor(plotW/Math.max(26,lblFont*4.5)))));
    for(var i=0;i<n;i++){
      for(var j=0;j<sn;j++){var v=Number(series[j].data[i])||0,h=maxV?v/maxV*plotH:0,x=padL+i*group+(group-bw*sn)/2+j*bw,y=baseY-h;
        s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-1).toFixed(1)+'" height="'+Math.max(0,h).toFixed(1)+'" rx="2" fill="'+pick(series[j].color)+'"><title>'+esc(String(labels[i]))+': '+nf(v)+'</title></rect>';}
      if(i%step===0){var lx=padL+i*group+group/2, ly=baseY+12;
        s+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="end" font-size="'+lblFont+'" fill="#6b6b6b" transform="rotate(-42 '+lx.toFixed(1)+' '+ly.toFixed(1)+')">'+esc(String(labels[i]))+'</text>';}
    }
    s+='</svg>';
    var leg='';
    if(sn>1){leg='<div style="display:flex;gap:16px;justify-content:flex-end;padding:2px 12px 0;font-size:11px;color:#6b6b6b">'+series.map(function(se){return '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:2px;background:'+pick(se.color)+'"></span>'+esc(se.name||'')+'</span>';}).join('')+'</div>';}
    el.innerHTML=leg+s;
  }
  function barChart(wrapId,labels,data,color){svgChart(wrapId,labels,[{data:data,color:color||CHART_BRAND}]);}
  function groupChart(wrapId,labels,sets){svgChart(wrapId,labels,sets.map(function(x){return {name:x.label,data:x.data,color:x.backgroundColor};}));}
  function lineChart(wrapId,labels,data,color){
    var el=document.getElementById(wrapId); if(!el) return;
    color=color||CHART_BRAND;
    var W=Math.max(el.clientWidth||700,320), H=el.clientHeight||300;
    var maxLen=0; labels.forEach(function(l){var L=String(l==null?'':l).length;if(L>maxLen)maxLen=L;});
    var lblFont=maxLen>16?8:(maxLen>9?9:10);
    var padB=Math.min(100,30+Math.round(maxLen*lblFont*0.55)), padL=56,padR=14,padT=14, n=Math.max(labels.length,1);
    var maxV=1; data.forEach(function(v){v=Number(v)||0;if(v>maxV)maxV=v;});
    var plotW=W-padL-padR, plotH=H-padT-padB, baseY=padT+plotH;
    var X=function(i){return padL+(n<=1?plotW/2:i*(plotW/(n-1)));};
    var Y=function(v){return baseY-(maxV?(Number(v)||0)/maxV*plotH:0);};
    var nf=function(v){return Number(v).toLocaleString(undefined,{maximumFractionDigits:0});};
    var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family="Inter,system-ui,sans-serif">';
    for(var g=0;g<=4;g++){var gy=padT+plotH*(1-g/4);
      s+='<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="#ececec"/>';
      s+='<text x="'+(padL-6)+'" y="'+(gy+3).toFixed(1)+'" text-anchor="end" font-size="10" fill="#9a9a9a">'+nf(maxV*g/4)+'</text>';}
    var pts=data.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);});
    if(pts.length){
      s+='<path d="M'+X(0).toFixed(1)+','+baseY.toFixed(1)+' L'+pts.join(' L')+' L'+X(n-1).toFixed(1)+','+baseY.toFixed(1)+' Z" fill="'+color+'" fill-opacity="0.08"/>';
      s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      if(n<=45) data.forEach(function(v,i){s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.4" fill="'+color+'"><title>'+esc(String(labels[i]))+': '+nf(v)+'</title></circle>';});
    }
    var step=Math.max(1,Math.ceil(n/Math.max(1,Math.floor(plotW/Math.max(26,lblFont*4.5)))));
    for(var i2=0;i2<n;i2++){ if(i2%step===0){var lx=X(i2),ly=baseY+12;
      s+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="end" font-size="'+lblFont+'" fill="#6b6b6b" transform="rotate(-42 '+lx.toFixed(1)+' '+ly.toFixed(1)+')">'+esc(String(labels[i2]))+'</text>';}}
    s+='</svg>'; el.innerHTML=s;
  }

      var active=M.blocks.filter(function(b){return b.status==='Active';});
      var stCols=[{h:'Status',k:'status',render:function(v){return statusTag(v);}},{h:'Blocks',k:'blocks',num:true},
        {h:'Plants',k:'plants',num:true},{h:'Cuttings taken',k:'taken',num:true,strong:true}];
      var vCols=[{h:'Variety',k:'variety',strong:true},{h:'Blocks',k:'blocks',num:true},{h:'Cuttings taken',k:'taken',num:true,strong:true}];
      var cards=kpi('Mother blocks',fmt(M.blocks.length),fmt(active.length)+' active','bldg',drill('Mother blocks',blockCols,M.blocks))+
        kpi('Mother plants',fmt(plants),'Across all blocks','leaf',drill('By status',stCols,M.by_status))+
        kpi('Cuttings taken',fmt(taken),'Lifetime, per block totals','sum',drill('By variety',vCols,M.by_variety))+
        kpi('Budwood harvests',fmt(M.harvests.length),fmt(stems)+' stems recorded','doc',drill('Budwood harvests',harvestCols,M.harvests))+
        kpi('Stems not booked',fmt(unbooked),fmt(M.unassigned.length)+' harvests with no batch','warn',M.unassigned.length?drill('Harvests not booked into a batch',harvestCols,M.unassigned):null);
      var html=hd('Mother stock','The blocks the cuttings come from'+filterNote())+'<div class="aph-kpis">'+cards+'</div>'+
        '<div style="margin-bottom:18px">'+extLink('/app/mother-block','Mother Blocks')+' &nbsp; '+extLink('/app/budwood-harvest','Budwood Harvests')+'</div>'+
        '<div class="aph-grid">'+chartCard('Cuttings taken by variety','Top 15','pr-mb-var')+chartCard('Cuttings taken by block','Top 15','pr-mb-blk')+'</div>'+
        (M.unassigned.length?card('⚠ Budwood not booked into a batch','These stems were harvested but never linked to a propagation batch, so they are not counted as cuttings received','<div class="aph-card-body padless">'+tbl(harvestCols,M.unassigned)+'</div>'):'')+
        card('Mother blocks','Sorted by cuttings taken','<div class="aph-card-body padless">'+tbl(blockCols,M.blocks)+'</div>')+
        '<div class="aph-grid"><div class="aph-card"><div class="aph-card-hd"><div class="ttl">By status</div></div><div class="aph-card-body padless">'+tbl(stCols,M.by_status)+'</div></div>'+
        '<div class="aph-card"><div class="aph-card-hd"><div class="ttl">By variety</div></div><div class="aph-card-body padless">'+tbl(vCols,M.by_variety)+'</div></div></div>'+
        card('Budwood harvests','Newest first','<div class="aph-card-body padless">'+tbl(harvestCols,M.harvests)+'</div>');
      document.getElementById('aph-content').innerHTML=html;
      barChart('pr-mb-var',M.by_variety.slice(0,15).map(function(r){return r.variety;}),M.by_variety.slice(0,15).map(function(r){return r.taken;}),'#2563eb');
      var topB=M.blocks.slice(0,15);
      barChart('pr-mb-blk',topB.map(function(r){return r.name;}),topB.map(function(r){return r.total_cuttings_taken;}),'#16a34a');
    });
  }

  // ---- TRACEABILITY ----
  function trace(){
    var args={propagation_batch:state.batchSel||'',company:state.company||'',include_completed:state.done?1:0};
    return frp('frappe.desk.query_report.run',{report_name:'Propagation Traceability',filters:JSON.stringify(args),ignore_prepared_report:1}).then(function(m){
      var rows=(m&&m.result)||[];
      var cols=[{h:'Step',k:'step',strong:true},
        {h:'Document',k:'document',render:function(v,r){return v?docLink(String(r.document_type||'').toLowerCase().replace(/ /g,'-'),v):'—';}},
        {h:'Date',k:'on_date',mono:true,render:function(v){return d10(v);}},
        {h:'Qty',k:'qty',num:true},{h:'Amount',k:'amount',num:true,render:function(v){return v?kes(v):'—';}},
        {h:'Status',k:'status',render:function(v){return statusTag(v);}},{h:'Detail',k:'detail',dim:true}];
      var picker='<div class="batch-pick"><input id="trace-input" list="batch-dl" placeholder="Trace one batch (blank = recent batches)…" value="'+esc(state.batchSel||'')+'"><span class="hint">'+fmt(rows.length)+' rows</span></div>';
      var dl=state.batchList?('<datalist id="batch-dl">'+state.batchList.map(function(b){return '<option value="'+esc(b.name)+'"></option>';}).join('')+'</datalist>'):'';
      document.getElementById('aph-content').innerHTML=hd('Traceability','The whole chain as one list — mother block, budwood, request, stages, logs, dispatches, invoice'+filterNote())+picker+dl+
        '<div style="margin-bottom:18px">'+extLink('/app/query-report/Propagation Traceability','Open the report in the desk')+'</div>'+
        card('Propagation Traceability',(state.batchSel?esc(state.batchSel):'Most recent active batches'),'<div class="aph-card-body padless">'+tbl(cols,rows)+'</div>');
      if(!state.batchList)loadBatchList();
    });
  }

  // ---- wire ----
  var root=document.querySelector('.aph');
  root.addEventListener('click',function(e){
    var bt=e.target.closest('[data-batch]');
    if(bt){state.batchSel=bt.getAttribute('data-batch');switchTab('batch360');return;}
    var k=e.target.closest('[data-drill]');
    if(k){var d=state.drills[k.getAttribute('data-drill')];if(d)showModal(esc(d.title),tbl(d.cols,d.rows));}
  });
  root.addEventListener('change',function(e){
    if(e.target&&e.target.id==='batch-input'){
      var val=(e.target.value||'').trim();var id=val.split('  (')[0].trim();
      if(state.batchList){var hit=state.batchList.filter(function(x){return x.name===id;})[0];if(hit)id=hit.name;}
      if(id){state.batchSel=id;fetchData();}
      return;
    }
    if(e.target&&e.target.id==='trace-input'){state.batchSel=(e.target.value||'').trim()||null;fetchData();return;}
  });
  document.getElementById('aph-modal-x').addEventListener('click',closeModal);
  document.getElementById('aph-modal').addEventListener('click',function(e){if(e.target.id==='aph-modal')closeModal();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
  Array.prototype.forEach.call(document.querySelectorAll('.aph-side .nav-item'),function(el){el.addEventListener('click',function(){switchTab(el.getAttribute('data-tab'));});});
  document.getElementById('aph-company').addEventListener('change',function(e){state.company=e.target.value;state.batchList=null;fetchData();});
  document.getElementById('aph-from').addEventListener('change',function(e){state.from=e.target.value;fetchData();});
  document.getElementById('aph-to').addEventListener('change',function(e){state.to=e.target.value;fetchData();});
  document.getElementById('aph-done').addEventListener('click',function(){state.done=state.done?0:1;var b=document.getElementById('aph-done');b.textContent='Completed: '+(state.done?'on':'off');b.classList.toggle('on',!!state.done);state.batchList=null;fetchData();});
  document.getElementById('aph-reload').addEventListener('click',function(){state.batchList=null;fetchData();});
  document.getElementById('aph-clear').addEventListener('click',function(){state.company='';state.from='';state.to='';state.done=0;state.batchSel=null;state.batchList=null;
    document.getElementById('aph-company').value='';document.getElementById('aph-from').value='';document.getElementById('aph-to').value='';
    var b=document.getElementById('aph-done');b.textContent='Completed: off';b.classList.remove('on');fetchData();});
  (function foot(){function go(){if(!window.frappe||!frappe.session){setTimeout(go,120);return;}var u=frappe.session.user||'';var nm=(frappe.session.user_fullname||u.split('@')[0]);
    document.getElementById('aph-foot-av').textContent=(nm||'?').substring(0,1).toUpperCase();document.getElementById('aph-foot-nm').textContent=nm;document.getElementById('aph-foot-em').textContent=u;}go();})();
  function opt(sel,vals){var s=document.getElementById(sel);vals.forEach(function(v){if(!v)return;var o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});}
  glist('Company',{fields:['name'],order_by:'name'}).catch(function(){return [];}).then(function(rows){opt('aph-company',rows.map(function(x){return x.name;}));});
  fetchData();
})();
</script>

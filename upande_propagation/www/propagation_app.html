<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Upande Propagation</title>
		<link rel="icon" type="image/svg+xml" href="/assets/upande_propagation/images/propagation_logo.svg" />
		<!-- Poppins is self-hosted via @font-face in the bundled propagation_css. -->
		<link rel="stylesheet" href="{{ propagation_css }}" />

		<style>
			.navbar.navbar-light { display: none !important; }
			.web-footer { display: none !important; }
			html, body { height: 100%; margin: 0; padding: 0; background: #fbfaf6; }
			body { overflow: hidden; }
			#propagation-root { height: 100vh; width: 100%; overflow: auto;
				font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
			.page-content, .container, main.container { max-width: none !important; padding: 0 !important; margin: 0 !important; }

			/* The cover that holds the screen while the bundle loads. Inline, and
			   before the stylesheet link resolves, because its whole job is to be
			   on screen in the first frame. White, like Frappe's own splash: it
			   belongs to the crossing between the desk and this app. */
			.pr-splash {
				position: fixed; inset: 0; z-index: 2147483000;
				display: flex; align-items: center; justify-content: center;
				background: #ffffff;
				transition: opacity 280ms ease;
			}
			.pr-splash img { width: 106px; height: auto; display: block; }
			.pr-splash.pr-leaving { opacity: 0; pointer-events: none; }
		</style>
	</head>
	<body>
		<div id="propagation-root"></div>
		<div class="pr-splash" id="pr-splash">
			<img id="pr-splash-mark" src="/assets/upande_propagation/images/propagation_logo_loader.svg" alt="Upande Propagation" />
			<script>
				// Entering a crop (#/<crop_key>/...): that crop's own loader, if one is built; else the generic one.
				(function () {
					var VIEWS = ["dashboard", "batches", "logs", "requests", "dispatch", "troughs", "consignments", "trials", "mother-blocks", "traceability"];
					var k = (location.hash.match(/^#\/([a-z0-9-]+)/) || [])[1];
					var img = document.getElementById("pr-splash-mark");
					if (!k || !img || VIEWS.indexOf(k) >= 0) return;
					var fallback = img.src;
					img.onerror = function () { img.onerror = null; img.src = fallback; };
					img.src = "/assets/upande_propagation/images/propagation_logo_" + k + "_loader.svg";
				})();
			</script>
		</div>

		<script type="application/json" id="propagation-bootstrap">{{ bootstrap_json | safe }}</script>
		<script>
			(function () {
				var bootEl = document.getElementById("propagation-bootstrap");
				var boot = {};
				try { boot = JSON.parse(bootEl.textContent || "{}"); } catch (_) {}
				window.PROPAGATION = {
					csrf_token: boot.csrf_token || window.csrf_token || "",
					bootstrap: boot
				};
			})();
		</script>
		<script type="module" src="{{ propagation_js }}"></script>
	</body>
</html>
